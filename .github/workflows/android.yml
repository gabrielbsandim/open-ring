name: Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  build:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # A manual run stays a plain build, so it cannot register a Shorebird
      # release before the tagged one does.
      - name: Decide how to build
        id: kind
        run: |
          if [ "${{ github.event_name }}" = push ] && [ -n "$SHOREBIRD_TOKEN" ] && [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "shorebird=true" >> "$GITHUB_OUTPUT"
          else
            echo "shorebird=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.kind.outputs.shorebird != 'true'
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - uses: shorebirdtech/setup-shorebird@v1
        if: steps.kind.outputs.shorebird == 'true'
        with:
          cache: true

      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Write the upload key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" > android/key.properties

      - name: Build the app
        if: steps.kind.outputs.shorebird != 'true'
        run: |
          flutter pub get
          flutter build appbundle --release
          flutter build apk --release

      # A patch reuses the Flutter version of its release, so this pin is the only one.
      - name: Build as a Shorebird release
        if: steps.kind.outputs.shorebird == 'true'
        run: shorebird release android --artifact apk --flutter-version=3.47.7 --no-confirm

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.TAG }}
          path: |
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Attach the APK to the GitHub release
        if: github.event_name == 'push' && env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/OpenRing-$TAG.apk"
          gh release upload "$TAG" "$RUNNER_TEMP/OpenRing-$TAG.apk" --clobber

      - name: Send the bundle to the Play production track
        if: steps.kind.outputs.shorebird == 'true' && env.PLAY_SERVICE_ACCOUNT != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          packageName: gbs.openring.app
          releaseFiles: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          mappingFile: apps/mobile/build/app/outputs/mapping/release/mapping.txt
          whatsNewDirectory: apps/mobile/distribution/whatsnew
          track: production
          status: completed
