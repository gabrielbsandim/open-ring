name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n
        working-directory: apps/mobile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test ring_protocol
        run: dart test
        working-directory: packages/ring_protocol

      - name: Test ring_driver
        run: dart test
        working-directory: packages/ring_driver

      - name: Test metrics
        run: dart test
        working-directory: packages/metrics

      - name: Test mobile app
        run: flutter test
        working-directory: apps/mobile
