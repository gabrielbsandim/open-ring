targets:
  $default:
    builders:
      drift_dev:
        generate_for:
          - lib/core/database/**
          - lib/features/*/infrastructure/**
        options:
          databases:
            app: lib/core/database/app_database.dart
          generate_manager: false
          schema_dir: drift_schemas/
          test_dir: test/drift/
          sql:
            dialect: sqlite
            options:
              version: "3.45"
