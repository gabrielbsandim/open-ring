name: open_ring
description: OpenRing, a local-first companion app for Colmi smart rings.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ^3.13.5

resolution: workspace

dependencies:
  archive: ^4.6.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.15
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  geolocator: ^14.1.2
  go_router: ^18.0.2
  health: ^13.3.2
  health_connect_writer:
    path: ../../packages/health_connect_writer
  home_widget: ^0.10.0
  intl: ^0.20.2
  meta: ^1.17.0
  metrics:
    path: ../../packages/metrics
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  ring_driver:
    path: ../../packages/ring_driver
  ring_notifications:
    path: ../../packages/ring_notifications
  ring_protocol:
    path: ../../packages/ring_protocol
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  workmanager: ^0.10.10

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.3
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^11.0.0
  xml: ^7.1.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - shorebird.yaml
